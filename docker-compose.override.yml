# Carregado automaticamente por `docker compose up`: ajustes de desenvolvimento.
services:
  api:
    environment:
      APP_ENV: development
      WEB_CONCURRENCY: "1"  # --reload usa um unico processo
    volumes:
      - ./:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
